<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<meta name="theme-color" content="#170b38">
<title>Alzeo cockpit</title>
<script src="/static/js/theme.js"></script>
<link rel="icon" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/css/cockpit.css">
<style>
  body{display:grid; place-items:center; padding:var(--s-5)}
  .gate{position:relative; z-index:1; width:min(420px, 100%); display:flex; flex-direction:column; gap:var(--s-5);
    padding:var(--s-7); border-radius:var(--r-hero); border:1px solid var(--rule-2);
    background:var(--gate-bg); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    box-shadow:var(--gate-shadow), var(--shadow-1);
    animation:pop .45s var(--ease) both}
  .gate::before{content:''; position:absolute; left:24px; right:24px; top:-1px; height:2px; border-radius:2px;
    background:linear-gradient(90deg, transparent, var(--gate-line), transparent)}
  .gate .brand{gap:var(--s-3)}
  .gate .brand .mark{width:44px; height:44px}
  .gate .brand .word b{font-size:var(--t-20)}
  .gate p{color:var(--fg-2); font-size:var(--t-14)}
  .gate code{font-family:var(--f-code); font-size:var(--t-13); color:var(--fg-1); background:var(--ink-0); border:1px solid var(--rule-2); border-radius:6px; padding:1px 6px}
  .gate .err{min-height:20px; color:var(--gate-err); font-size:var(--t-14)}
</style>
</head>
<body>
<canvas id="backdrop" aria-hidden="true"></canvas>
  <form class="gate" id="f">
    <span class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <defs><linearGradient id="mk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4ecff"/><stop offset=".45" stop-color="#a676ff"/><stop offset="1" stop-color="#4a1fa8"/></linearGradient>
          <linearGradient id="mk-edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9dbff"/><stop offset="1" stop-color="#6b3fd4"/></linearGradient></defs>
        <rect x="2.5" y="2.5" width="27" height="27" rx="8" fill="#120a22" stroke="url(#mk-edge)" stroke-width="1.2"/>
        <path d="M6.5 18.6c2.9-2.1 5.4-2.1 8.3 0s5.5 2.1 8.4 0l2.3-1.5v5.4a3.4 3.4 0 0 1-3.4 3.4H9.9a3.4 3.4 0 0 1-3.4-3.4z" fill="url(#mk)"/>
        <path d="M10 9h12" stroke="#56d6ff" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span class="word"><b>Alzeo</b><small>cockpit · the control room of this DGX Spark</small></span>
    </span>
    <p>Enter the server's API key. It is in <code>~/.config/qwen38/api-key</code> on the box.</p>
    <div class="field">
      <label for="k">API key</label>
      <input class="input code" id="k" type="password" autocomplete="current-password" autofocus required>
    </div>
    <button class="btn primary lg block" type="submit">Enter the cockpit</button>
    <div class="err" id="e" role="alert"></div>
  </form>
<script src="/static/js/backdrop.js" defer></script>
<script src="/static/login.js" defer></script>
</body>
</html>
